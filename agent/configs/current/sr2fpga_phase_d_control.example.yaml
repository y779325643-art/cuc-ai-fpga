# Six deterministic B_ref controls for the Phase D pilot families.
dataset_root: artifacts/agent/candidates/sr2fpga_phase_d_control_v1
export_root: artifacts/agent/candidates/sr2fpga_phase_d_control_v1_exports
run_root: artifacts/agent/runs
provider: deterministic
repair_provider: none
model: deterministic
base_url: ""
api_key_env: ""
env_file: ""
platform: generic_verilog
max_attempts: 1
refresh_exports: true
sample_id_prefix: phase_d_control
run_independent_oracle: true
run_l4_open: true

line_b_targets:
  l3_success_ratio: 1.0
  repair_trajectory_ratio: 0.0
  max_samples: 6

l4_open:
  tool: openxc7_nextpnr
  target_part: XC7Z020CLG484-2
  board_profile: ac820_zynq
  run_policy: representative_subset
  timeout_seconds: 600
  family_ids: [fir_filter]

tasks:
  - {source: deterministic, task_type: fifo, widths: [8], count: 1, requirement_style: simple_prompt, evaluation_line: line_b, failure_origin: deterministic_template, failure_injectors: []}
  - {source: deterministic, task_type: component_topology, topology_ids: [t2_stream_accumulator], widths: [8], count: 1, requirement_style: simple_prompt, evaluation_line: line_b, failure_origin: deterministic_template, failure_injectors: []}
  - {source: deterministic, task_type: component_topology, topology_ids: [t4_dual_stream_join], widths: [8], count: 1, requirement_style: simple_prompt, evaluation_line: line_b, failure_origin: deterministic_template, failure_injectors: []}
  - {source: deterministic, task_type: fir_filter, widths: [8], count: 1, requirement_style: simple_prompt, evaluation_line: line_b, failure_origin: deterministic_template, failure_injectors: []}
  - {source: deterministic, task_type: sobel_threshold, widths: [8], count: 1, requirement_style: simple_prompt, evaluation_line: line_b, failure_origin: deterministic_template, failure_injectors: []}
  - {source: deterministic, task_type: component_topology, topology_ids: [t6_td_update_core], widths: [8], count: 1, requirement_style: simple_prompt, evaluation_line: line_b, failure_origin: deterministic_template, failure_injectors: []}
