# Deterministic Line-A oracle-strength evidence batch.
# Difficulty tiers are intentionally omitted so the v0.2 task catalog remains
# authoritative. Catalog DUT-only mutations are run automatically by the agent.
dataset_root: artifacts/agent/candidates/sr2fpga_line_a_oracle_evidence/dataset
export_root: artifacts/agent/candidates/sr2fpga_line_a_oracle_evidence/exports
run_root: artifacts/agent/runs/sr2fpga_line_a_oracle_evidence
provider: deterministic
repair_provider: none
model: deterministic
base_url: ""
api_key_env: ""
env_file: ""
platform: generic_verilog
max_attempts: 1
refresh_exports: true
sample_id_prefix: line_a_oracle_evidence
run_l4_open: false

line_b_targets:
  l3_success_ratio: 1.0
  repair_trajectory_ratio: 0.0
  max_samples: 6

tasks:
  - source: deterministic
    task_type: fifo
    widths: [8]
    count: 1
    evaluation_line: line_a
    failure_origin: deterministic
    measurement_point: a_first_attempt_no_tools
    requirement_style: simple_prompt

  - source: deterministic
    task_type: uart_tx
    widths: [8]
    count: 1
    evaluation_line: line_a
    failure_origin: deterministic
    measurement_point: a_first_attempt_no_tools
    requirement_style: simple_prompt

  - source: deterministic
    task_type: spi_master
    widths: [8]
    count: 1
    evaluation_line: line_a
    failure_origin: deterministic
    measurement_point: a_first_attempt_no_tools
    requirement_style: simple_prompt

  - source: deterministic
    task_type: streaming_valid_ready
    widths: [8]
    count: 1
    evaluation_line: line_a
    failure_origin: deterministic
    measurement_point: a_first_attempt_no_tools
    requirement_style: simple_prompt

  - source: deterministic
    task_type: fir_filter
    widths: [8]
    count: 1
    evaluation_line: line_a
    failure_origin: deterministic
    measurement_point: a_first_attempt_no_tools
    requirement_style: simple_prompt

  - source: deterministic
    task_type: matrix_vector_mac
    widths: [8]
    count: 1
    evaluation_line: line_a
    failure_origin: deterministic
    measurement_point: a_first_attempt_no_tools
    requirement_style: simple_prompt
