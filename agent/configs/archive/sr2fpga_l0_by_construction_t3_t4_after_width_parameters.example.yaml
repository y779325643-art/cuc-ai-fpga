# Narrow T3/T4 behavior-files rerun after skeleton width-parameter hardening.
# Uses a fresh sample_id_prefix so results cannot reuse prior generated samples.
dataset_root: datasets/sr2fpga_rtl_v1
export_root: datasets/sr2fpga_rtl_v1_exports
run_root: tmp/sr2fpga_runs
provider: deepseek
repair_provider: none
model: deepseek-v4-pro
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
env_file: .env
platform: generic_verilog
max_attempts: 1
refresh_exports: true
sample_id_prefix: l0_by_construction_t3_t4_after_width_parameters

line_b_targets:
  l3_success_ratio: 0.4
  repair_trajectory_ratio: 0.6
  max_samples: 2

tasks:
  - source: deepseek-his-v12
    task_type: component_topology
    topology_ids: [t3_stream_fork, t4_dual_stream_join]
    requirement_style: natural_component
    failure_origin: natural_llm
    measurement_point: a_first_attempt_no_tools
    widths: [8]
    count: 2
    failure_injectors: []
