# L0-by-construction ablation rerun after the 2026-06-28 post-run
# lowerability fixes. This keeps the same paired T1-T4 task design as the
# original config but uses a distinct sample_id_prefix to avoid sample_exists
# reuse from the first run.
dataset_root: datasets/sr2fpga_rtl_v1
export_root: datasets/sr2fpga_rtl_v1_exports
run_root: tmp/sr2fpga_runs
provider: deepseek
repair_provider: none
model: deepseek-v4-pro
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
env_file: .env
platform: generic_verilog
max_attempts: 1
refresh_exports: true
sample_id_prefix: l0_by_construction_ablation_after_fixes

line_b_targets:
  l3_success_ratio: 0.4
  repair_trajectory_ratio: 0.6
  max_samples: 8

tasks:
  - source: deepseek
    task_type: component_topology
    topology_ids: [t1_event_counter, t2_stream_accumulator, t3_stream_fork, t4_dual_stream_join]
    requirement_style: natural_component
    failure_origin: natural_llm
    measurement_point: a_first_attempt_no_tools
    widths: [8]
    count: 4
    failure_injectors: []
  - source: deepseek-his-v12
    task_type: component_topology
    topology_ids: [t1_event_counter, t2_stream_accumulator, t3_stream_fork, t4_dual_stream_join]
    requirement_style: natural_component
    failure_origin: natural_llm
    measurement_point: a_first_attempt_no_tools
    widths: [8]
    count: 4
    failure_injectors: []
