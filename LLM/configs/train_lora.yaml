model_name_or_path: google/gemma-4-12B-it
train_file: LLM/data/train.jsonl
output_dir: LLM/runs/gemma4_12b_lora

max_seq_length: 2048
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 0.0001
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200

use_qlora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
