model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
train_file: artifacts/training/prepared-data/t0-t4-req2file-short/chat.jsonl
output_dir: artifacts/training/adapters/qwen2_5_coder_7b_req2file_short_lora

max_seq_length: 2048
max_steps: 50
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
warmup_ratio: 0.0
logging_steps: 1
save_steps: 25

use_qlora: true
bf16: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
